grpc:
  server:
    port: 0
    reflection-service-enabled: true

spring:
  application:
    name: aggregator
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcTransactionManagerAutoConfiguration

eureka:
  instance:
    preferIpAddress: true
    hostname: localhost
    instance-id: ${spring.application.name}:${random.value}
    leaseRenewalIntervalInSeconds: 10

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    ru.practicum: DEBUG
    org.apache.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level --- [%thread] %logger{36} : %msg%n"

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  consumer:
    group-id: ${KAFKA_CONSUMER_GROUP_ID:aggregator-consumer}
    auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    value-deserializer: ru.practicum.serialization.UserActionAvroDeserializer
    enable-auto-commit: false

  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer

    value-serializer: ru.practicum.serialization.SpecificRecordSerializer
    acks: all
    retries: 3
    linger-ms: 100
    max-in-flight-requests-per-connection: 1
    delivery-timeout-ms: 120000
    request-timeout-ms: 30000
    enable-idempotence: true

  topics:
    input-topic: ${KAFKA_INPUT_TOPIC:stats.user-actions.v1}
    output-topic: ${KAFKA_OUTPUT_TOPIC:stats.events-similarity.v1}