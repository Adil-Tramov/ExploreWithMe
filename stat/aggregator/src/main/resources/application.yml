grpc:
  server:
    port: 0
    reflection-service-enabled: true

spring:
  application:
    name: aggregator
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcTransactionManagerAutoConfiguration
  cloud:
    config:
      enabled: false

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true
    hostname: localhost
    instance-id: ${spring.application.name}:${random.value}
    leaseRenewalIntervalInSeconds: 10

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    ru.practicum: DEBUG
    org.apache.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level --- [%thread] %logger{36} : %msg%n"

kafka:
  bootstrap-servers: localhost:9092

  consumer:
    group-id: aggregator-consumer
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: ru.practicum.serialization.UserActionAvroDeserializer
    enable-auto-commit: false

  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: ru.practicum.serialization.SpecificRecordSerializer
    acks: all
    retries: 3
    linger-ms: 100
    max-in-flight-requests-per-connection: 1
    delivery-timeout-ms: 120000
    request-timeout-ms: 30000
    enable-idempotence: true

  topics:
    input-topic: stats.user-actions.v1
    output-topic: stats.events-similarity.v1